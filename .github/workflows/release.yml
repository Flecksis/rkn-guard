name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          BUILD_BRANCH=master
          LDFLAGS="-X main.version=${VERSION} -X main.branch=${BUILD_BRANCH}"

          # Сборка для Linux на AMD64.
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/rkn-guard-linux-amd64 ./cmd

          # Сборка для Linux на ARM64.
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/rkn-guard-linux-arm64 ./cmd

          # Сборка для Linux на ARM.
          GOOS=linux GOARCH=arm go build -ldflags="${LDFLAGS}" -o dist/rkn-guard-linux-arm ./cmd

          # Сборка для Linux на 386.
          GOOS=linux GOARCH=386 go build -ldflags="${LDFLAGS}" -o dist/rkn-guard-linux-386 ./cmd

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/rkn-guard-*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
