name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/rkn-guard" ./cmd
      - name: Установить защиту и проверить оба режима удаления на одноразовой VM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ipset iptables ufw rsyslog logrotate
          if ! sudo env PATH="$PATH" RKN_GUARD_BIN="$RUNNER_TEMP/rkn-guard" bash tests/integration/full_uninstall_flow.sh > "$RUNNER_TEMP/install.log" 2>&1; then
            tail -20 "$RUNNER_TEMP/install.log"
            echo "::error::$(tail -20 "$RUNNER_TEMP/install.log" | tr '\n' ' ')"
            exit 1
          fi
          cat "$RUNNER_TEMP/install.log"
      - name: Проверить откат обновления списков и правил UFW
        env:
          RKN_RUNNER: ${{ runner.environment }}
        run: |
          sudo install -m755 "$RUNNER_TEMP/rkn-guard" /usr/local/bin/rkn-guard
          if ! sudo env RKN_DISPOSABLE_TEST=yes RUNNER_ENVIRONMENT="$RKN_RUNNER" GITHUB_ACTIONS=true bash tests/integration/safe_updates.sh > "$RUNNER_TEMP/rollback.log" 2>&1; then
            tail -15 "$RUNNER_TEMP/rollback.log"
            echo "::error::$(tail -15 "$RUNNER_TEMP/rollback.log" | tr '\n' ' ')"
            exit 1
          fi
          cat "$RUNNER_TEMP/rollback.log"
  packaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'fedora:43', 'rockylinux/rockylinux:9', 'almalinux:9']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/rkn-guard" ./cmd
      - name: Установка и повторная установка CLI в контейнере
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/rkn-guard:/candidate:ro" "$IMAGE" bash -ec '
            source "/src/app install.sh"
            for attempt in 1 2; do
              file=$(mktemp); cp /candidate "$file"; install_binary "$file"; verify_installation
            done
            /usr/local/bin/rkn-guard build-info
            /usr/local/bin/rkn-guard sources --help
            bash -n /src/install.sh
          '
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -ldflags="-X main.version=dev -X main.branch=$BUILD_BRANCH" -o "$RUNNER_TEMP/rkn-guard" ./cmd
        env:
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      - run: for file in install.sh tests/*.sh tests/integration/*.sh; do bash -n "$file" || exit 1; done
      - name: Проверить привязку и отзыв доступа панели по SSH
        run: |
          sudo apt-get install -y openssh-server iptables
          sudo env RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" unshare --mount --net --pid --fork --mount-proc bash tests/integration/panel_ssh.sh
      - run: bash tests/menu_versions.sh
      - run: python3 tests/menu_terminal.py
      - run: python3 tests/update_schedule.py
      - run: python3 tests/extra_lists_menu.py
      - run: python3 tests/attack_stats.py
      - run: RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" python3 tests/live_logs.py
      - run: sudo env RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" python3 tests/source_failures_cli.py
      - run: sudo env GITHUB_ACTIONS=true RUNNER_OS=Linux RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" bash tests/integration/update_schedule_systemd.sh
      - run: sudo env GITHUB_ACTIONS=true RUNNER_OS=Linux RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" python3 tests/integration/extra_lists.py
      - name: Проверить указанные публичные списки без применения
        run: sudo env GITHUB_ACTIONS=true RUNNER_OS=Linux RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" RKN_TEST_PUBLIC_LISTS=yes python3 tests/integration/extra_lists.py ExtraListsIntegration.test_public_raw_lists_validate_without_applying
      - name: Проверить применение в отдельном сетевом пространстве
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ipset
          sudo unshare --net env GITHUB_ACTIONS=true RUNNER_OS=Linux RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" bash tests/integration/extra_lists_ipset.sh
      - name: Проверить исключения и UFW в отдельной сети
        run: |
          sudo apt-get install -y ufw
          sudo unshare --mount --net env RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" python3 tests/integration/exceptions.py
      - name: Проверить nftables и переустановку
        run: |
          sudo apt-get install -y nftables
          sudo unshare --mount --net env RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" python3 tests/integration/nftables.py
      - name: Проверить совместимость с firewalld
        run: |
          sudo apt-get install -y python3-dbus python3-gi
          mkdir -p "$RUNNER_TEMP/firewalld-test"
          cd "$RUNNER_TEMP/firewalld-test"
          apt-get download firewalld python3-firewall python3-nftables
          for pkg in *.deb; do dpkg-deb -x "$pkg" root; done
          cd "$GITHUB_WORKSPACE"
          sudo unshare --mount --net env RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" RKN_FIREWALLD_ROOT="$RUNNER_TEMP/firewalld-test/root" python3 tests/integration/nftables.py
